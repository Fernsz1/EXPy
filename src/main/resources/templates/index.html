<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EXPy</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Gamja+Flower&display=swap" rel="stylesheet">
    <!-- Particles -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- CSS -->
    <link rel="icon" href="/images/logoonly.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar">
    <div class="left">
        <div class="logo">
          <img src="/images/logoonly.png" alt="EXPy Logo">
        </div>
        <nav>
            <a href="#">About us</a>
        </nav>
    </div>
    <div class="auth-buttons">
      <a href="/login" class="btn login">Login</a>
      <a href="/signup" class="btn signup">Signup</a>
    </div>
</header>

<section class="hero">
  <!-- Particles layer -->
  <div id="particles-js"></div>

  <!-- Foreground content -->
  <h1>Become a <span class="highlight">Python</span><br>Sorcerer!</h1>
  <a href="/signup" class="btn get-started">Get Started→</a>
</section>

   

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
  particlesJS("particles-js", {
    "particles": {
      "number": {
        "value": 80,
        "density": { "enable": true, "value_area": 800 }
      },
      "color": {
      "value": ["#FFD700", "#7A3E9D"] // gold and purple
    },
      "shape": {
        "type": "circle",
        "stroke": { "width": 0, "color": "#000000" }
      },
      "opacity": {
        "value": 0.5,
        "random": false
      },
      "size": {
        "value": 3,
        "random": true
      },
      "line_linked": {
        "enable": true,
        "distance": 150,
        "color": "#ffffff",
        "opacity": 0.4,
        "width": 1
      },
      "move": {
        "enable": true,
        "speed": 6,
        "direction": "none",
        "random": false,
        "straight": false,
        "out_mode": "out"
      }
    },
    "interactivity": {
      "detect_on": "canvas",
      "events": {
        "onhover": { "enable": true, "mode": "repulse" },
        "onclick": { "enable": true, "mode": "push" }
      },
      "modes": {
        "repulse": { "distance": 100, "duration": 0.4 },
        "push": { "particles_nb": 4 }
      }
    },
    "retina_detect": true
  });
</script>

</body>
</html>
