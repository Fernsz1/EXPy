<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EXPy</title>
    <link rel="stylesheet" href="/css/login.css">
    
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Gamja+Flower&display=swap" rel="stylesheet">

</head>
<body>
<div id="particles-js"></div>
<div class="login-container">
  
  <!-- Logo -->
  <div class="logo-wrapper">
    <img src="/images/logobg.png" alt="Logo BG" class="logo-bg">
    <img src="/images/logo.png" alt="EXPy Logo" class="logo">
  </div>

  <!-- Heading -->
  <h1>Glad you’ve returned!</h1>

  <!-- Inputs -->
  <input type="text" placeholder="username / email" class="login-input">
  <input type="password" placeholder="password" class="login-input">
  <span class="forgot">forgot password?</span>

  <!-- Sign In -->
  <button class="btn-login">Sign In</button>

  <!-- Sign Up -->
  <p class="signup-text">
    Don’t have an account? <a href="#">Sign Up</a>
  </p>
</div>



<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
  particlesJS("particles-js", {
    "particles": {
      "number": {
        "value": 80,
        "density": { "enable": true, "value_area": 800 }
      },
      "color": {
      "value": ["#FFFFFF"]
    },
      "shape": {
        "type": "circle",
        "stroke": { "width": 0, "color": "#000000" }
      },
      "opacity": {
        "value": 0.5,
        "random": false
      },
      "size": {
        "value": 3,
        "random": true
      },
      "line_linked": {
        "enable": true,
        "distance": 150,
        "color": "#ffffff",
        "opacity": 0.4,
        "width": 1
      },
      "move": {
        "enable": true,
        "speed": 6,
        "direction": "none",
        "random": false,
        "straight": false,
        "out_mode": "out"
      }
    },
    "interactivity": {
      "detect_on": "canvas",
      "events": {
        "onhover": { "enable": true, "mode": "repulse" },
        "onclick": { "enable": true, "mode": "push" }
      },
      "modes": {
        "repulse": { "distance": 100, "duration": 0.4 },
        "push": { "particles_nb": 4 }
      }
    },
    "retina_detect": true
  });
</script>

</body>
</html>
