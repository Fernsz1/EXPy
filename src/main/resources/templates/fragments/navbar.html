<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Navbar Fragment -->
    <header class="navbar" th:fragment="navbar(activePage)">
        <div class="left">
            <div class="logo">
                <img th:src="@{/images/logo.png}" alt="EXPy Logo" loading="eager" fetchpriority="high">
            </div>
            <nav>
                <a class="nav-link" 
                   th:classappend="${activePage == 'home'} ? 'active' : ''"
                   th:href="@{/home}">Dashboard</a>
                <a class="nav-link" 
                   th:classappend="${activePage == 'lessons'} ? 'active' : ''"
                   th:href="@{/lessons}">Lessons</a>
                <a class="nav-link" 
                   th:classappend="${activePage == 'challenges'} ? 'active' : ''"
                   th:href="@{/challenges}">Challenges</a>
                <a class="nav-link" 
                   th:classappend="${activePage == 'playground'} ? 'active' : ''"
                   th:href="@{/playground}">Playground</a>
            </nav>
        </div>
        <div class="user-section">
            <div class="user-dropdown" id="userDropdown">
                <span class="user-name" th:text="${userName != null ? userName : '[User]'}">[User]</span>
                <img th:src="${userAvatar != null ? userAvatar : '/images/avatar.png'}" alt="User Avatar" class="user-avatar" loading="eager" fetchpriority="high">
                <svg class="dropdown-arrow" id="dropdownArrow" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="user-dropdown-menu" id="userDropdownMenu">
                <a th:href="@{/account}" class="dropdown-item" id="accountLink">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 8C10.2091 8 12 6.20914 12 4C12 1.79086 10.2091 0 8 0C5.79086 0 4 1.79086 4 4C4 6.20914 5.79086 8 8 8Z" fill="currentColor"/>
                        <path d="M8 10C4.68629 10 2 12.6863 2 16H14C14 12.6863 11.3137 10 8 10Z" fill="currentColor"/>
                    </svg>
                    My Account
                </a>
                <a th:href="@{/}" class="dropdown-item" id="logoutLink">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 14H3C2.44772 14 2 13.5523 2 13V3C2 2.44772 2.44772 2 3 2H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 11L14 7L10 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 7H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Logout
                </a>
            </div>
        </div>
    </header>
</body>
</html>
