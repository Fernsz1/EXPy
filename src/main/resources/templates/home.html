<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - EXPy</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Gamja+Flower&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="icon" href="/images/logoonly.png" type="image/png">
</head>
<body>
    <!-- Header/Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>
    
    <!-- Navbar Dropdown Script -->
    <script src="/js/navbar-dropdown.js"></script>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Welcome Section -->
        <section class="welcome-section">
            <h1 class="welcome-title">Welcome, [User]!</h1>
        </section>

        <!-- Stats Grid -->
        <section class="stats-section">
            <!-- EXP Points Card -->
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/images/exp.png" alt="EXP Icon">
                </div>
                <div class="stat-content">
                    <h3 class="stat-label">EXP Points</h3>
                    <p class="stat-value">1,250</p>
                </div>
            </div>

            <!-- Streak Card -->
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/images/streak.png" alt="Streak Icon">
                </div>
                <div class="stat-content">
                    <h3 class="stat-label">Streak</h3>
                    <p class="stat-value">7 days 🔥</p>
                </div>
            </div>

            <!-- Badges Card -->
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/images/badge.png" alt="Badges Icon">
                </div>
                <div class="stat-content">
                    <h3 class="stat-label">Badges</h3>
                    <p class="stat-value">12</p>
                </div>
            </div>

            <!-- Leaderboard Card -->
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/images/leaderboard.png" alt="Leaderboard Icon">
                </div>
                <div class="stat-content">
                    <h3 class="stat-label">Leaderboard Rank</h3>
                    <p class="stat-value">#45</p>
                </div>
            </div>
        </section>

        <!-- Content Grid -->
        <section class="content-grid">
            <!-- Leaderboard Section -->
            <div class="content-card leaderboard-card">
                <h2 class="card-title">Leaderboard</h2>
                <div class="leaderboard-list">
                    <div class="leaderboard-item">
                        <span class="rank">1</span>
                        <img src="/images/avatar.png" alt="Avatar" class="leaderboard-avatar">
                        <span class="leaderboard-name">Player One</span>
                        <span class="leaderboard-score">5,000 EXP</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">2</span>
                        <img src="/images/avatar.png" alt="Avatar" class="leaderboard-avatar">
                        <span class="leaderboard-name">Player Two</span>
                        <span class="leaderboard-score">4,500 EXP</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">3</span>
                        <img src="/images/avatar.png" alt="Avatar" class="leaderboard-avatar">
                        <span class="leaderboard-name">Player Three</span>
                        <span class="leaderboard-score">4,000 EXP</span>
                    </div>
                    <div class="leaderboard-item current-user">
                        <span class="rank">45</span>
                        <img src="/images/avatar.png" alt="Avatar" class="leaderboard-avatar">
                        <span class="leaderboard-name">[User]</span>
                        <span class="leaderboard-score">1,250 EXP</span>
                    </div>
                </div>
            </div>

            <!-- Badges Section -->
            <div class="content-card badges-card">
                <h2 class="card-title">Your Badges</h2>
                        <div id="homeBadgesGrid" class="badges-grid">
                            <!-- Badges injected by JS; clicking opens popup card -->
                        </div>
                    </div>
                    <!-- Badge Modal (home) -->
                    <div id="homeBadgeModal" class="badge-modal" style="display:none;">
                        <div class="badge-modal-backdrop" id="homeBadgeModalBackdrop"></div>
                        <div class="badge-modal-card" id="homeBadgeModalCard">
                            <button class="badge-modal-close" id="homeBadgeModalClose">✕</button>
                            <img id="homeBadgeModalImage" src="" alt="Badge Image" />
                            <h3 id="homeBadgeModalTitle"></h3>
                            <p id="homeBadgeModalDescription"></p>
                            <p class="badge-criteria" id="homeBadgeModalCriteria"></p>
                        </div>
                    </div>
            </div>
        </section>
    </main>

    <script>
    // Home badges: fetch and render popup card
    (function(){
        const grid = document.getElementById('homeBadgesGrid');
        const modal = document.getElementById('homeBadgeModal');
        const backdrop = document.getElementById('homeBadgeModalBackdrop');
        const closeBtn = document.getElementById('homeBadgeModalClose');
        const imgEl = document.getElementById('homeBadgeModalImage');
        const titleEl = document.getElementById('homeBadgeModalTitle');
        const descEl = document.getElementById('homeBadgeModalDescription');
        const critEl = document.getElementById('homeBadgeModalCriteria');

        function openModal(b){
            imgEl.src = b.imageUrl || '/images/logoonly.png';
            titleEl.textContent = b.name || 'Badge';
            descEl.textContent = b.description || '';
            critEl.textContent = b.criteria ? ('Criteria: ' + b.criteria) : '';
            modal.style.display = 'flex';
            // small entrance animation
            document.getElementById('homeBadgeModalCard').classList.add('badge-pop');
            setTimeout(()=> document.getElementById('homeBadgeModalCard').classList.remove('badge-pop'), 350);
        }

        function closeModal(){ modal.style.display = 'none'; }
        backdrop.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);

        function renderBadge(b){
            const item = document.createElement('div');
            item.className = 'badge-item';
            const img = document.createElement('img');
            img.src = b.imageUrl || '/images/logoonly.png';
            img.alt = b.name || 'badge';
            img.className = 'badge-image';
            item.appendChild(img);
            const name = document.createElement('div');
            name.className = 'badge-name';
            name.textContent = b.name || '';
            item.appendChild(name);
            item.addEventListener('click', ()=> openModal(b));
            return item;
        }

        fetch('/api/badges/getAllBadges')
            .then(r=> r.ok ? r.json() : Promise.reject(r.status))
            .then(list=>{
                if(!Array.isArray(list) || list.length===0){
                    grid.innerHTML = '<p class="form-hint">No badges yet.</p>';
                    return;
                }
                grid.innerHTML = '';
                list.forEach(b=> grid.appendChild(renderBadge(b)));
            })
            .catch(err=>{
                console.warn('Failed to load badges', err);
                grid.innerHTML = '<p class="form-hint">Unable to load badges.</p>';
            });
    })();
    </script>

</body>
</html>
